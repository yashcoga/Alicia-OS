<style>
body{margin:0;background:#111111}

.wrap{max-width:1120px;margin:0 auto;padding:0 24px;box-sizing:border-box}
.btn{display:inline-block;background:#F04E98;color:#111111;font-family:Montserrat,Arial,sans-serif;font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;padding:18px 32px;border:0;border-radius:6px;text-decoration:none;min-height:44px;box-sizing:border-box;text-align:center;cursor:pointer}

.tick{width:22px;height:22px;flex:0 0 22px;border-radius:50%;background:#F04E98;display:flex;align-items:center;justify-content:center}

@media (max-width: 640px){

.silver{background:#E5E5E5;color:#111111}

.stack .shot{left:50%;top:0;width:560px;transform:translateX(-50%);border:1px solid #3A3F43}
.stack .cv1{left:0;bottom:0;width:190px;transform:rotate(-7deg)}
.stack .cv2{right:0;bottom:0;width:190px;transform:rotate(7deg)}

.inside figure{margin:0;display:flex;flex-direction:column;gap:8px;justify-content:flex-end}
.inside img{width:100%;height:auto;border-radius:8px;border:1px solid #BFC3C7;box-shadow:0 14px 30px -18px rgba(0,0,0,.5);display:block}
.inside figcaption{font-size:12px;color:#5A5F63;letter-spacing:.04em;text-transform:uppercase}
.bonus .thumb{flex:0 0 auto;width:120px;border-radius:6px;box-shadow:0 12px 24px -14px rgba(0,0,0,.55);display:block}

</div>
